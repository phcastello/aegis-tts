engine: graillon_lv2
round: round3
defaults: {sample_rate: 24000, channels: 1, sample_format: s16le}
plugin: {uri_env: AEGIS_GRAILLON_PLUGIN_URI}
round3_hard_tune: &base
  wet_mix: 0.85
  dry_mix: 0.15
  global_amount: 1.0
  output_gain: 0.707946
  correction_enabled: 1.0
  correction_amount: 1.0
  midi_enabled: 0.0
  ptm_enabled: 0.0
  tune_keyboard: 0.0
  compressor: 0.0
  gate: 0.0
  chorus: 0.0
  doubler: 0.0
  fx_enabled: 1.0
  pitch_shift: 0.5
  formant_enabled: 1.0
  formant_amount: 1.0
  formant_shift: 0.5
  pitch_engine: 0.5
  smooth: 0.04
  inertia: 0.06
  snap_min: 0.0
  snap_max: 1.0
  allow_c: 1.0
  allow_c_sharp: 0.0
  allow_d: 0.0
  allow_d_sharp: 1.0
  allow_e: 0.0
  allow_f: 1.0
  allow_f_sharp: 0.0
  allow_g: 1.0
  allow_g_sharp: 0.0
  allow_a: 0.0
  allow_a_sharp: 1.0
  allow_b: 0.0
