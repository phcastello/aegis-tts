reference:
  clean_env: AEGIS_GLADOS_CLEAN_WAV
  target_env: AEGIS_GLADOS_TARGET_WAV
  melodyne_project_env: AEGIS_GLADOS_MELODYNE_PROJECT
analysis:
  sample_rate: 24000
  frame_ms: 10
  f0_floor_hz: 70
  f0_ceiling_hz: 500
search:
  max_candidates: 80
scoring:
  pitch: 0.45
  spectral_envelope: 0.30
  dynamics: 0.10
  timing: 0.10
  artifacts_penalty: 0.05
engines:
  - id: passthrough
    type: passthrough
    enabled: true
    parameters: {}
  - id: graillon-hard
    type: graillon_lv2
    enabled: true
    parameters: {quantization: chromatic, correction_amount: 1.0, smooth: 0.0, inertia: 0.0, wet: 1.0, formant_shift: 0.0}
  - id: praat-hard-chromatic
    type: praat
    enabled: true
    parameters: {quantization: chromatic, correction_amount: 1.0, flatten_amount: 1.0, preserve_drift: 0.0, preserve_modulation: 0.0, transition_ms: 0}
  - id: world-hard-chromatic
    type: world
    enabled: true
    parameters: {quantization: chromatic, correction_amount: 1.0, flatten_amount: 1.0, transition_ms: 0, spectral_envelope_preserve: 1.0, formant_shift: 0.0, aperiodicity_preserve: 1.0}
