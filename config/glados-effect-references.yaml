root: AegisVoicemods
effects:
  pitch_centralization: C
  pitch_modulation: M
  formant_shift: F
references:
  none: {file: clean.wav, effects: []}
  C: {file: Voice_PitchCentralizationOnly.wav, effects: [C]}
  M: {file: Voice_PitchModulationOnly.wav, effects: [M]}
  F: {file: Voice_FormantOnly.wav, effects: [F]}
  CM: {file: Voice_PitchCentralizationAndPitchModulation.wav, effects: [C, M]}
  FM: {file: Voice_FormantAndPitchModulation.wav, effects: [F, M]}
  CF:
    file: Voice_FormantAndPitchCentralization.wav
    effects: [C, F]
    confirmed_by_operator: true
  CFM: {file: target-melodyne.wav, effects: [C, F, M]}

scoring:
  schema_version: 2
  denominator_epsilon: 1.0e-8
  minimum_informative_distance:
    pitch: 0.02
    modulation: 0.02
    formant: 0.02
  artifact_tolerance:
    clipping_fraction: 0.001
    click_count: 2
    gap_fraction: 0.02
  # Convert heterogeneous raw excesses into a dimensionless score penalty.
  artifact_penalty_weights:
    clipping_fraction: 100.0
    click_count: 0.01
    gap_fraction: 5.0

optimization:
  batch_trials: 200
  max_total_trials: 1000
  allocation:
    pitch_centralization: 0.20
    pitch_modulation: 0.20
    formant_shift: 0.20
    chains: 0.40
  tpe:
    seed: 40733133
    n_startup_trials: 10
    multivariate: true
    group: true
  chains:
    sampler: nsga2
    population_size: 20
  pareto:
    reference_point: [2.0, 2.0, 2.0]
  reproducibility:
    strict_mode: false
    rerender_best_candidates: 3
    score_aggregation: median

validation:
  enabled: true
  required_before_optimization: true
  participate_in_optimization: false
  directory: AegisVoicemods/Validation
  clean_file: cleanValidation.wav
  target_file: Validation_All.wav
  transcript_file: Validation.txt
  references:
    none: cleanValidation.wav
    C: Validation_PitchCentralization.wav
    M: Validation_PitchMod.wav
    F: Validation_Formant.wav
    CM: Validation_PitchModAndPitchCentralization.wav
    FM: Validation_PitchModAndFormantShift.wav
    CF: Validation_FormantAndPitchCentralization.wav
    CFM: Validation_All.wav
  evaluate_top_k: 10
  reject_if_score_degradation_over: 0.35
