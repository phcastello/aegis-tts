  dry_mix: 0.15
  global_amount: 1.0
  output_gain: 0.707946
  correction_enabled: 1.0
  correction_amount: 1.0
  midi_enabled: 0.0
  ptm_enabled: 0.0
  tune_keyboard: 0.0
  compressor: 0.0
  gate: 0.0
  chorus: 0.0
  doubler: 0.0
  fx_enabled: 1.0
  pitch_shift: 0.5
  formant_shift: 0.5
  pitch_engine: __base_engine__
  smooth: 0.04
  inertia: 0.06
  snap_min: 0.0
  snap_max: 1.0
  formant_enabled: 1.0
  formant_amount: 1.0
  allow_c: 1.0
  allow_c_sharp: 1.0
  allow_d: 1.0
  allow_d_sharp: 1.0
  allow_e: 1.0
  allow_f: 1.0
  allow_f_sharp: 1.0
  allow_g: 1.0
  allow_g_sharp: 1.0
  allow_a: 1.0
  allow_a_sharp: 1.0
  allow_b: 1.0
