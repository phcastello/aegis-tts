sentences:
  - {id: neutral-short, text: "Todos os sistemas estão funcionando normalmente."}
  - {id: direct-address, text: "Pedro, encontrei uma inconsistência no servidor principal."}
  - {id: question, text: "Você realmente deseja desligar o sistema de segurança?"}
  - {id: detection, text: "O sistema de detecção não identificou nenhum movimento."}
  - {id: time, text: "Agora são três horas e quarenta e sete minutos."}
  - {id: numbers, text: "Existem vinte e três dispositivos conectados, e dois estão indisponíveis."}
  - {id: acronym, text: "A VPN está ativa, mas o DNS interno não respondeu."}
  - {id: technical, text: "A utilização da GPU atingiu sessenta e dois por cento."}
  - {id: command, text: "Verifique a porta da garagem antes de sair."}
  - {id: sarcastic, text: "Naturalmente, reiniciar todos os serviços sem investigar foi uma excelente ideia."}
  - {id: reassurance, text: "Não há motivo para preocupação. Eu já corrigi o problema."}
  - {id: long, text: "O processamento foi concluído, os arquivos foram validados e nenhuma alteração inesperada foi detectada durante a execução."}
  - {id: failure, text: "Não foi possível concluir a operação porque o dispositivo deixou de responder."}
  - {id: sibilants, text: "Seis sensores silenciosos estão instalados no sistema de segurança."}
  - {id: plosives, text: "Pedro pediu para bloquear temporariamente a porta principal."}
