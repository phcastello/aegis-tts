services:
  aegis-tts-static-cache:
    extends:
      file: docker-compose.yml
      service: aegis-tts
    image: aegis-tts:static-cache
    container_name: aegis-tts-static-cache
    restart: "no"
    # !override replaces the production 0.0.0.0:8001 mapping inherited above.
    ports: !override
      - "${AEGIS_TTS_STATIC_CACHE_BIND_ADDRESS:-127.0.0.1}:${AEGIS_TTS_STATIC_CACHE_PORT:-8002}:8001"
    volumes:
      - ./models:/models:ro
      - ./cache-static:/cache
      - ./voices:/voices:ro
      - ./samples-static:/samples
      - ./config:/config:ro
    environment:
      AEGIS_TTS_CACHE_IMPLEMENTATION: static
      AEGIS_TTS_PROFILE_GENERATION: "${AEGIS_TTS_PROFILE_GENERATION:-false}"
      AEGIS_TTS_GENERATION_TIMEOUT_SECONDS: "${AEGIS_TTS_STATIC_CACHE_GENERATION_TIMEOUT_SECONDS:-600}"
      AEGIS_TTS_ALLOWED_ORIGINS: "http://localhost:8002"
      TORCH_LOGS: "graph_breaks,recompiles,perf_hints"
