services:
  # Default production runtime: validated vLLM-Omni 0.6B Base configuration.
  aegis-tts:
    build:
      context: .
      dockerfile: ${AEGIS_GATEWAY_DOCKERFILE:-gateway/Dockerfile}
    image: ${AEGIS_GATEWAY_IMAGE:-aegis-tts-gateway:aegisvoicev1.0}
    container_name: aegis-tts
    restart: unless-stopped
    entrypoint: []
    command: ["/usr/bin/bash", "/gateway/run-vllm-with-default-reference.sh"]
    ports:
      - "${AEGIS_TTS_BIND_ADDRESS:-127.0.0.1}:${AEGIS_TTS_PORT:-8001}:8001"
    volumes:
      - ./models/Qwen3-TTS-12Hz-0.6B-Base:/models/Qwen3-TTS-12Hz-0.6B-Base:ro
      - ./cache/vllm-omni:/cache
      - ./protected/AegisVoicev1.0:/protected:ro
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_ENABLE_CUDA_COMPATIBILITY: "1"
      VLLM_LOGGING_LEVEL: WARNING
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      XDG_CACHE_HOME: /cache/xdg
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      HOME: /cache/home
      PYTHONPATH: /gateway
      AEGIS_VLLM_BACKEND_URL: http://127.0.0.1:8091
      AEGIS_VLLM_DEPLOY_CONFIG: /protected/config/q00-vllm-deploy-exact.yaml
      AEGIS_ALLOW_REPLACE_ALL: ${AEGIS_ALLOW_REPLACE_ALL:-0}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    shm_size: 8gb
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20m
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "3"
