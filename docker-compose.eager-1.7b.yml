# Rollback compose preserved before promoting vLLM-Omni to production.
services:
  aegis-tts:
    image: aegis-tts:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AEGIS_UID: "${AEGIS_TTS_UID:-1002}"
        AEGIS_GID: "${AEGIS_TTS_GID:-1002}"
    container_name: aegis-tts
    restart: unless-stopped
    ports:
      - "${AEGIS_TTS_BIND_ADDRESS:-0.0.0.0}:${AEGIS_TTS_PORT:-8001}:${AEGIS_TTS_INTERNAL_PORT:-8001}"
    volumes:
      - ./models:/models
      - ./cache:/cache
      - ./voices:/voices:ro
      - ./samples:/samples
      - ./config:/config:ro
    environment:
      AEGIS_TTS_HOST: "0.0.0.0"
      AEGIS_TTS_PORT: "${AEGIS_TTS_INTERNAL_PORT:-8001}"
      AEGIS_TTS_VOICES_CONFIG: /config/voices.json
      AEGIS_TTS_API_KEY: "${AEGIS_TTS_API_KEY:-}"
      AEGIS_TTS_MAX_TEXT_LENGTH: "${AEGIS_TTS_MAX_TEXT_LENGTH:-1000}"
      AEGIS_TTS_QUEUE_TIMEOUT_SECONDS: "${AEGIS_TTS_QUEUE_TIMEOUT_SECONDS:-240}"
      AEGIS_TTS_GENERATION_TIMEOUT_SECONDS: "${AEGIS_TTS_GENERATION_TIMEOUT_SECONDS:-180}"
      AEGIS_TTS_SAVE_SAMPLES: "${AEGIS_TTS_SAVE_SAMPLES:-false}"
      AEGIS_TTS_MAX_SAMPLES: "${AEGIS_TTS_MAX_SAMPLES:-100}"
      AEGIS_TTS_PROFILE_GENERATION: "${AEGIS_TTS_PROFILE_GENERATION:-false}"
      AEGIS_TTS_CACHE_IMPLEMENTATION: "${AEGIS_TTS_CACHE_IMPLEMENTATION:-}"
      AEGIS_TTS_LOG_LEVEL: "${AEGIS_TTS_LOG_LEVEL:-INFO}"
      AEGIS_TTS_ALLOWED_ORIGINS: "${AEGIS_TTS_ALLOWED_ORIGINS:-http://10.1.1.47:8001,http://localhost:8001}"
      QWEN_MODEL_ID: Qwen/Qwen3-TTS-12Hz-1.7B-Base
      QWEN_MODEL_DIR: /models/Qwen3-TTS-12Hz-1.7B-Base
      QWEN_DEVICE: cuda:0
      QWEN_DTYPE: "${QWEN_DTYPE:-bfloat16}"
      QWEN_ATTENTION_IMPLEMENTATION: sdpa
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      HOME: /cache/home
      XDG_CACHE_HOME: /cache/xdg
      NUMBA_CACHE_DIR: /cache/numba
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    user: "${AEGIS_TTS_UID:-1002}:${AEGIS_TTS_GID:-1002}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1g
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3.12 -c "import os, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' +
          os.getenv('AEGIS_TTS_PORT', '8001') + '/health/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
