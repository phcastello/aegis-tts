# Source: vllm-project/vllm-omni v0.22.0
# Commit: 963ba1ab7a02b2c1f687285fcd2072cd57cd0b34
# Official file: vllm_omni/deploy/qwen3_tts.yaml
# Official SHA-256: 82960d8ad7cb3ae2456f73d860b988e90f63e14181a3d5e776a76db27db58fa5
#
# A2000-only differences:
# - max_num_seqs: 10 -> 1 in both stages.
# - gpu_memory_utilization: 0.30 -> 0.20 in both stages. The fit script
#   creates qwen3-tts-runtime.yaml and tests 0.20 down to 0.10.
# - Stage 0 sampling matches the approved Aegis preset.
# - devices remains GPU 0.
# No codec window, max_model_len, max_num_batched_tokens, connector, async
# scheduling/chunking, or CUDA Graph setting was reduced/disabled.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_cudagraph_capture_sizes: [25, 73, 97, 169, 325]

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.20
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_p: 0.9
      top_k: 50
      min_tokens: 2
      max_tokens: 1024
      seed: 41
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.20
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 41
      repetition_penalty: 1.0

platforms:
  npu:
    stages:
      - stage_id: 0
        enforce_eager: true
