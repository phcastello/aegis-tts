name: aegis-tts-vllm-experiment

services:
  aegis-tts-vllm:
    image: vllm/vllm-omni@sha256:8b0cc5438eb27b34cdfd22011b735da6a94835a09e9c56ddf9e8cb300d679919
    container_name: aegis-tts-vllm
    restart: "no"
    entrypoint: []
    command:
      - vllm
      - serve
      - /models/${VLLM_MODEL_DIR:-Qwen3-TTS-12Hz-1.7B-Base}
      - --deploy-config
      - /config/qwen3-tts-runtime.yaml
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --trust-remote-code
      - --uvicorn-log-level
      - warning
    ports:
      - "127.0.0.1:8004:8091"
    volumes:
      - ../../models/${VLLM_MODEL_DIR:-Qwen3-TTS-12Hz-1.7B-Base}:/models/${VLLM_MODEL_DIR:-Qwen3-TTS-12Hz-1.7B-Base}:ro
      - ../../voices/giseli-34s:/voices/giseli-34s:ro
      - ../../cache/vllm-omni:/cache
      - ./qwen3-tts-a2000.yaml:/config/qwen3-tts-a2000.yaml:ro
      - ../../cache/vllm-omni/runtime-config:/config
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_ENABLE_CUDA_COMPATIBILITY: "1"
      CUDA_LAUNCH_BLOCKING: "${VLLM_CUDA_LAUNCH_BLOCKING:-0}"
      VLLM_LOGGING_LEVEL: WARNING
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      XDG_CACHE_HOME: /cache/xdg
      HOME: /cache/home
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    shm_size: 8gb
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20m
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "3"
