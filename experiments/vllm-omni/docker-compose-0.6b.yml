name: aegis-tts-vllm-0-6b-experiment

services:
  aegis-tts-vllm:
    volumes:
      - ../../models/Qwen3-TTS-12Hz-0.6B-Base:/models/Qwen3-TTS-12Hz-0.6B-Base:ro
    command:
      - vllm
      - serve
      - /models/Qwen3-TTS-12Hz-0.6B-Base
      - --deploy-config
      - /config/qwen3-tts-runtime.yaml
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --trust-remote-code
      - --uvicorn-log-level
      - warning
