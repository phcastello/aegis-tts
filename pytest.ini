[pytest]
testpaths = tests
markers =
    gpu: opt-in test requiring a ready local GPU-backed service and imported model weights
    graillon_integration: opt-in test requiring local JACK dummy and Graillon LV2
    reverse_engineering_integration: opt-in test requiring optional reverse-engineering engines
    modulation_integration: opt-in test requiring the factorial audio dataset and optional modulation engines
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
