# Isolated, no-DSP diagnostic.  It does not replace production port 8001.
services:
  qwen-vllm-clean:
    image: aegis-tts-gateway:qwen-vllm-clean
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: aegis-qwen-vllm-clean
    restart: "no"
    entrypoint: []
    command: ["/usr/bin/bash", "/gateway/run-vllm-clean-aninha.sh"]
    ports:
      - "0.0.0.0:${AEGIS_QWEN_VLLM_CLEAN_PORT:-8004}:8001"
    volumes:
      - ./models/Qwen3-TTS-12Hz-0.6B-Base:/models/Qwen3-TTS-12Hz-0.6B-Base:ro
      - ./protected/AegisVoicev1.0:/protected:ro
      - ./config/vllm-qwen3-tts-0.6b.yaml:/config/vllm-qwen3-tts-0.6b.yaml:ro
      - ./diagnostics:/diagnostics:ro
      - ./cache/vllm-omni-clean:/cache
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_ENABLE_CUDA_COMPATIBILITY: "1"
      VLLM_LOGGING_LEVEL: WARNING
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      XDG_CACHE_HOME: /cache/xdg
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      HOME: /cache/home
      PYTHONPATH: /gateway
      AEGIS_VLLM_BACKEND_URL: http://127.0.0.1:8091
      AEGIS_DEFAULT_REFERENCE_AUDIO: /protected/reference/Aninha_AegisVoice4.wav
      AEGIS_DEFAULT_REFERENCE_TEXT: /protected/reference/Aninha_AegisVoice4.txt
      AEGIS_DEFAULT_MODEL: /models/Qwen3-TTS-12Hz-0.6B-Base
      # The pre-Aegis vLLM decode/sampling settings.  Override only when an
      # explicit Q00 comparison is wanted.
      AEGIS_VLLM_DEPLOY_CONFIG: /config/vllm-qwen3-tts-0.6b.yaml
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    shm_size: 8gb
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
